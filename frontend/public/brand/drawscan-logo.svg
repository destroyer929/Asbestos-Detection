<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Scan Beam Emerald-Cyan Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Laser Beam Pulse -->
    <linearGradient id="laserGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Blueprint CAD Grid Pattern -->
    <pattern id="cadGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.14" />
    </pattern>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.5" />

  <!-- Blueprint CAD Grid Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#cadGrid)" />

  <!-- Inner Architectural Safety Frame -->
  <rect x="56" y="56" width="400" height="400" rx="76" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- CAD Target Corner Marks (Architectural Blueprint Markers) -->
  <path d="M 80 116 L 80 80 L 116 80" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 432 116 L 432 80 L 396 80" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 396 L 80 432 L 116 432" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 432 396 L 432 432 L 396 432" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stylized Geometric "D" (Drawscan Architecture) -->
  <!-- Outer D Path -->
  <path d="M 165 145 L 265 145 C 335 145 380 190 380 256 C 380 322 335 367 265 367 L 165 367 Z"
        fill="none" stroke="url(#scanBeam)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)" />

  <!-- Inner D Counter -->
  <path d="M 215 195 L 255 195 C 290 195 315 218 315 256 C 315 294 290 317 255 317 L 215 317 Z"
        fill="#072c20" fill-opacity="0.85" stroke="#34d399" stroke-width="3" stroke-opacity="0.7" />

  <!-- Blueprint Crosshairs inside counter -->
  <line x1="200" y1="256" x2="310" y2="256" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <line x1="256" y1="200" x2="256" y2="310" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />

  <!-- Diagonal Diagnostic Laser Scan Ray -->
  <line x1="105" y1="345" x2="405" y2="168" stroke="url(#laserGrad)" stroke-width="5" stroke-linecap="round" filter="url(#emeraldGlow)" />

  <!-- Central Precision AI Focal Reticle -->
  <circle cx="256" cy="256" r="38" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="22" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#emeraldGlow)" />
  <circle cx="256" cy="256" r="9" fill="#ffffff" />

  <!-- AI Network Junction Nodes -->
  <circle cx="165" cy="145" r="8" fill="#34d399" stroke="#ffffff" stroke-width="2" />
  <circle cx="165" cy="367" r="8" fill="#34d399" stroke="#ffffff" stroke-width="2" />
  <circle cx="380" cy="256" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
</svg>
